<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="120" viewBox="0 0 1200 120">
  <rect width="1200" height="120" fill="#0f172a" rx="12"/>
  <text x="600" y="22" text-anchor="middle" font-family="'Segoe UI',sans-serif" font-size="11" fill="#475569" font-weight="600" letter-spacing="3">TECHNOLOGY STACK</text>
  <!-- Row 1: Backend -->
  <g font-family="'Segoe UI',sans-serif" text-anchor="middle" font-size="9">
    <rect x="30" y="35" width="100" height="35" rx="6" fill="#0f172a" stroke="#3776ab" stroke-width="1.2"><animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="3s" repeatCount="indefinite"/></rect>
    <text x="80" y="48" fill="#3776ab" font-weight="700">🐍 Python 3.10+</text>
    <text x="80" y="62" fill="#475569" font-size="7">Backend Core</text>

    <rect x="145" y="35" width="100" height="35" rx="6" fill="#0f172a" stroke="#ee4c2c" stroke-width="1.2"><animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="3s" begin="0.3s" repeatCount="indefinite"/></rect>
    <text x="195" y="48" fill="#ee4c2c" font-weight="700">🔥 PyTorch 2.0+</text>
    <text x="195" y="62" fill="#475569" font-size="7">Deep Learning</text>

    <rect x="260" y="35" width="100" height="35" rx="6" fill="#0f172a" stroke="#009688" stroke-width="1.2"><animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="3s" begin="0.6s" repeatCount="indefinite"/></rect>
    <text x="310" y="48" fill="#009688" font-weight="700">⚡ FastAPI</text>
    <text x="310" y="62" fill="#475569" font-size="7">REST API</text>

    <rect x="375" y="35" width="100" height="35" rx="6" fill="#0f172a" stroke="#5C3EE8" stroke-width="1.2"><animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="3s" begin="0.9s" repeatCount="indefinite"/></rect>
    <text x="425" y="48" fill="#5C3EE8" font-weight="700">👁️ OpenCV 4.7+</text>
    <text x="425" y="62" fill="#475569" font-size="7">Image Processing</text>

    <rect x="490" y="35" width="105" height="35" rx="6" fill="#0f172a" stroke="#d97706" stroke-width="1.2"><animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="3s" begin="1.2s" repeatCount="indefinite"/></rect>
    <text x="542" y="48" fill="#d97706" font-weight="700">🔢 NumPy/SciPy</text>
    <text x="542" y="62" fill="#475569" font-size="7">Scientific Compute</text>

    <rect x="610" y="35" width="110" height="35" rx="6" fill="#0f172a" stroke="#f093fb" stroke-width="1.2"><animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="3s" begin="1.5s" repeatCount="indefinite"/></rect>
    <text x="665" y="48" fill="#f093fb" font-weight="700">🧪 scikit-image</text>
    <text x="665" y="62" fill="#475569" font-size="7">Frangi · Morphology</text>
  </g>
  <!-- Row 2: Frontend + Infra -->
  <g font-family="'Segoe UI',sans-serif" text-anchor="middle" font-size="9">
    <rect x="30" y="80" width="100" height="35" rx="6" fill="#0f172a" stroke="#fff" stroke-width="1.2"><animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="3s" begin="1.8s" repeatCount="indefinite"/></rect>
    <text x="80" y="93" fill="#fff" font-weight="700">▲ Next.js 14</text>
    <text x="80" y="107" fill="#475569" font-size="7">App Router</text>

    <rect x="145" y="80" width="100" height="35" rx="6" fill="#0f172a" stroke="#61DAFB" stroke-width="1.2"><animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="3s" begin="2.1s" repeatCount="indefinite"/></rect>
    <text x="195" y="93" fill="#61DAFB" font-weight="700">⚛️ React 18</text>
    <text x="195" y="107" fill="#475569" font-size="7">Components</text>

    <rect x="260" y="80" width="100" height="35" rx="6" fill="#0f172a" stroke="#3178C6" stroke-width="1.2"><animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="3s" begin="2.4s" repeatCount="indefinite"/></rect>
    <text x="310" y="93" fill="#3178C6" font-weight="700">📘 TypeScript</text>
    <text x="310" y="107" fill="#475569" font-size="7">Type Safety</text>

    <rect x="375" y="80" width="100" height="35" rx="6" fill="#0f172a" stroke="#f5576c" stroke-width="1.2"><animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="3s" begin="2.7s" repeatCount="indefinite"/></rect>
    <text x="425" y="93" fill="#f5576c" font-weight="700">💎 Lucide React</text>
    <text x="425" y="107" fill="#475569" font-size="7">Icon Library</text>

    <rect x="490" y="80" width="105" height="35" rx="6" fill="#0f172a" stroke="#2496ED" stroke-width="1.2"><animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="3s" begin="3s" repeatCount="indefinite"/></rect>
    <text x="542" y="93" fill="#2496ED" font-weight="700">🐳 Docker</text>
    <text x="542" y="107" fill="#475569" font-size="7">Containerized</text>

    <rect x="610" y="80" width="110" height="35" rx="6" fill="#0f172a" stroke="#22c55e" stroke-width="1.2"><animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="3s" begin="3.3s" repeatCount="indefinite"/></rect>
    <text x="665" y="93" fill="#22c55e" font-weight="700">📋 Pydantic</text>
    <text x="665" y="107" fill="#475569" font-size="7">Validation</text>
  </g>
  <!-- Animated progress bar bottom -->
  <rect x="0" y="118" width="0" height="2" rx="1" fill="#7b2ff7"><animate attributeName="width" values="0;1200;0" dur="8s" repeatCount="indefinite"/></rect>
</svg>
