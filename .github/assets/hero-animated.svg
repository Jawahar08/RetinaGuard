<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#020617"/>
      <stop offset="30%" style="stop-color:#0f172a"/>
      <stop offset="70%" style="stop-color:#1a0a2e"/>
      <stop offset="100%" style="stop-color:#020617"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00d2ff"/>
      <stop offset="50%" style="stop-color:#7b2ff7"/>
      <stop offset="100%" style="stop-color:#00d2ff"/>
      <animate attributeName="x1" values="0%;100%;0%" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="100%;200%;100%" dur="4s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="iris" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d2ff"/>
      <stop offset="100%" style="stop-color:#7b2ff7"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ff6b6b"/>
      <stop offset="100%" style="stop-color:#f093fb"/>
    </linearGradient>
    <filter id="gf"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="gf2"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M 50 0 L 0 0 0 50" fill="none" stroke="#1e293b" stroke-width="0.3"/>
    </pattern>
  </defs>
  <!-- Background -->
  <rect width="1200" height="340" fill="url(#bg)"/>
  <rect width="1200" height="340" fill="url(#grid)" opacity="0.4"/>
  <!-- Scan lines -->
  <rect width="1200" height="1.5" fill="#00d2ff" opacity="0.06" y="0"><animate attributeName="y" values="0;340;0" dur="7s" repeatCount="indefinite"/></rect>
  <rect width="1200" height="1" fill="#7b2ff7" opacity="0.05" y="340"><animate attributeName="y" values="340;0;340" dur="5s" repeatCount="indefinite"/></rect>
  <!-- Floating particles -->
  <circle r="1.5" fill="#00d2ff" opacity="0.5"><animate attributeName="cx" values="0;1200" dur="18s" repeatCount="indefinite"/><animate attributeName="cy" values="60;280" dur="18s" repeatCount="indefinite"/></circle>
  <circle r="1" fill="#7b2ff7" opacity="0.4"><animate attributeName="cx" values="1200;0" dur="14s" repeatCount="indefinite"/><animate attributeName="cy" values="250;40" dur="14s" repeatCount="indefinite"/></circle>
  <circle r="2" fill="#ff6b6b" opacity="0.3"><animate attributeName="cx" values="200;1000" dur="20s" repeatCount="indefinite"/><animate attributeName="cy" values="300;20" dur="20s" repeatCount="indefinite"/></circle>
  <circle r="1.5" fill="#64ffda" opacity="0.3"><animate attributeName="cx" values="800;100" dur="16s" repeatCount="indefinite"/><animate attributeName="cy" values="30;310" dur="16s" repeatCount="indefinite"/></circle>
  <circle r="1" fill="#ffd93d" opacity="0.25"><animate attributeName="cx" values="500;900" dur="12s" repeatCount="indefinite"/><animate attributeName="cy" values="280;60" dur="12s" repeatCount="indefinite"/></circle>
  <circle r="1.5" fill="#00d2ff" opacity="0.2"><animate attributeName="cx" values="1100;300" dur="22s" repeatCount="indefinite"/><animate attributeName="cy" values="150;200" dur="22s" repeatCount="indefinite"/></circle>
  <!-- Animated Eye -->
  <g transform="translate(600,110)" filter="url(#gf)">
    <circle r="60" fill="none" stroke="#00d2ff" stroke-width="0.8" opacity="0.2" stroke-dasharray="10 5"><animateTransform attributeName="transform" type="rotate" values="0;360" dur="25s" repeatCount="indefinite"/></circle>
    <circle r="70" fill="none" stroke="#7b2ff7" stroke-width="0.5" opacity="0.15" stroke-dasharray="6 10"><animateTransform attributeName="transform" type="rotate" values="360;0" dur="20s" repeatCount="indefinite"/></circle>
    <ellipse rx="50" ry="33" fill="none" stroke="url(#glow)" stroke-width="3"><animate attributeName="ry" values="33;36;33" dur="3s" repeatCount="indefinite"/></ellipse>
    <circle r="24" fill="url(#iris)" opacity="0.9"><animate attributeName="r" values="24;27;24" dur="3s" repeatCount="indefinite"/></circle>
    <circle r="10" fill="#020617"><animate attributeName="r" values="10;8;10" dur="3s" repeatCount="indefinite"/></circle>
    <circle r="4" fill="#fff" cx="-6" cy="-6" opacity="0.8"><animate attributeName="opacity" values="0.8;0.4;0.8" dur="2s" repeatCount="indefinite"/></circle>
    <circle r="2" fill="#fff" cx="5" cy="-9" opacity="0.4"/>
  </g>
  <!-- Title -->
  <text x="600" y="200" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="58" font-weight="800" fill="url(#glow)" filter="url(#gf)">RetinaGuard</text>
  <!-- Subtitle line 1 -->
  <text x="600" y="240" text-anchor="middle" font-family="'Segoe UI',sans-serif" font-size="15" fill="#94a3b8" letter-spacing="3">ENHANCED ENSEMBLE DEEP LEARNING × DIGITAL IMAGE PROCESSING</text>
  <!-- Subtitle line 2 -->
  <text x="600" y="265" text-anchor="middle" font-family="'Segoe UI',sans-serif" font-size="14" fill="#64748b" letter-spacing="2">RETINAL FUNDUS IMAGE DISEASE SCREENING SYSTEM</text>
  <!-- Cursor blink -->
  <rect x="825" y="250" width="2" height="16" fill="#00d2ff"><animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/></rect>
  <!-- Corner brackets -->
  <polyline points="20,50 20,20 50,20" fill="none" stroke="#00d2ff" stroke-width="1.5" opacity="0.4"><animate attributeName="opacity" values="0.4;0.9;0.4" dur="3s" repeatCount="indefinite"/></polyline>
  <polyline points="1180,50 1180,20 1150,20" fill="none" stroke="#7b2ff7" stroke-width="1.5" opacity="0.4"><animate attributeName="opacity" values="0.4;0.9;0.4" dur="3s" begin="1.5s" repeatCount="indefinite"/></polyline>
  <polyline points="20,290 20,310 50,310" fill="none" stroke="#ff6b6b" stroke-width="1.5" opacity="0.4"><animate attributeName="opacity" values="0.4;0.9;0.4" dur="3s" begin="0.75s" repeatCount="indefinite"/></polyline>
  <polyline points="1180,290 1180,310 1150,310" fill="none" stroke="#64ffda" stroke-width="1.5" opacity="0.4"><animate attributeName="opacity" values="0.4;0.9;0.4" dur="3s" begin="2.25s" repeatCount="indefinite"/></polyline>
  <!-- Bottom accent line -->
  <rect x="200" y="325" width="800" height="2" rx="1" fill="#0f172a"/>
  <rect x="200" y="325" width="0" height="2" rx="1" fill="url(#glow)"><animate attributeName="width" values="0;800;0" dur="6s" repeatCount="indefinite"/></rect>
</svg>
